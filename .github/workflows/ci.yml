name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted only: never run pull requests from forks on a self-hosted machine.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Cache VS Code test build
        uses: actions/cache@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-stable-${{ hashFiles('package-lock.json') }}

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package .vsix
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error
