name: Novosapiens release

# Push a tag novo-v<version> (matching package.json) to build the .vsix, attach it to a release,
# commit it to vsix/ (latest only) and publish to the VS Code Marketplace (needs VSCE_PAT).
on:
  push:
    tags: ['novo-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json
        run: test "novo-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" \
            --notes "Novosapiens build of ${GITHUB_SHA::7}. Install: see README."

      - name: Commit the .vsix to vsix/ on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch -q origin "$BRANCH"
          git checkout -q -B "$BRANCH" "origin/$BRANCH"
          git rm -q --ignore-unmatch 'vsix/*.vsix'
          mkdir -p vsix && cp ./*.vsix vsix/
          git add vsix
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore: add the $GITHUB_REF_NAME .vsix to vsix/"
          git push -q origin "$BRANCH"
          git checkout -q "$GITHUB_SHA"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret not set; skipping Marketplace publish."
            exit 0
          fi
          npm run package:marketplace
          npx vsce publish --packagePath marketplace/*.vsix
